services:
  # 1. Base inference service image builder
  inference-image:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    image: modelforge-inference:latest
    container_name: modelforge-inference-builder
    restart: "no"
    entrypoint: ["echo", "ModelForge inference replica image built successfully."]

  # 2. ModelForge Control Plane Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modelforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DOCKER_ENABLED=true
      - DOCKER_NETWORK=modelforge-network
      - INFERENCE_IMAGE=modelforge-inference:latest
      - MODEL_STORAGE_MOUNT=modelforge-models
      - MODEL_STORAGE_DIR=/app/storage/models
      - DATABASE_URL=sqlite:///./modelforge.db
      # Database Backend: 'sqlite' (default) or 'firestore' (Cloud Firestore)
      - DATABASE_BACKEND=sqlite
      # Firebase Authentication & Firestore (Optional - Phase 8.5)
      # - FIREBASE_PROJECT_ID=your-project-id
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      # - FIREBASE_AUTH_ENABLED=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80
      - MAX_REPLICAS=5
      - CONTAINER_HEALTHCHECK_TIMEOUT_SEC=5.0
    volumes:
      - modelforge-models:/app/storage/models
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - modelforge-network
    depends_on:
      - inference-image

  # 3. ModelForge Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modelforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      # Optional: Firebase Web SDK config for frontend authentication
      # - VITE_FIREBASE_API_KEY=your-api-key
      # - VITE_FIREBASE_AUTH_DOMAIN=your-project.firebaseapp.com
      # - VITE_FIREBASE_PROJECT_ID=your-project-id
      # - VITE_FIREBASE_STORAGE_BUCKET=your-project.appspot.com
      # - VITE_FIREBASE_MESSAGING_SENDER_ID=your-sender-id
      # - VITE_FIREBASE_APP_ID=your-app-id
    networks:
      - modelforge-network
    depends_on:
      - backend

  # 4. Optional Cloud-Ready PostgreSQL Database
  # To use PostgreSQL instead of SQLite, set DATABASE_URL=postgresql://modelforge:modelforge@db:5432/modelforge in backend environment
  db:
    image: postgres:16-alpine
    container_name: modelforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modelforge-network

volumes:
  modelforge-models:
    name: modelforge-models
  postgres-data:
    name: modelforge-postgres-data

networks:
  modelforge-network:
    name: modelforge-network
    driver: bridge
