apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: modelforge-backend
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
