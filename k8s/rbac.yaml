apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelforge-backend
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelforge-model-server
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: model-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelforge-frontend
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modelforge-backend-role
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
rules:
  # Least-privilege access for backend workload orchestration
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modelforge-backend-rolebinding
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: modelforge-backend
    namespace: modelforge
roleRef:
  kind: Role
  name: modelforge-backend-role
  apiGroup: rbac.authorization.k8s.io
