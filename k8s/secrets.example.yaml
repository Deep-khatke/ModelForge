apiVersion: v1
kind: Secret
metadata:
  name: modelforge-secrets
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-this-to-a-secure-random-32-character-secret"
  # Place the raw JSON content of your firebase service account private key here:
  firebase-credentials.json: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "example-key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n",
      "client_email": "firebase-adminsdk-xxx@your-project-id.iam.gserviceaccount.com"
    }
