apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelforge-promtail
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelforge-promtail
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelforge-promtail
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelforge-promtail
subjects:
  - kind: ServiceAccount
    name: modelforge-promtail
    namespace: modelforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.modelforge.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: modelforge-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: modelforge
              namespace: modelforge
              __path__: /var/log/pods/modelforge_*/*/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: level
                request_id: request_id
                event: event
                service: service
                latency_ms: latency_ms
          - labels:
              level:
              service:
              event:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: modelforge
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modelforge
        app.kubernetes.io/component: promtail
    spec:
      serviceAccountName: modelforge-promtail
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods-log
              mountPath: /var/log/pods
              readOnly: true
            - name: containers-log
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          emptyDir: {}
        - name: pods-log
          hostPath:
            path: /var/log/pods
        - name: containers-log
          hostPath:
            path: /var/lib/docker/containers
