apiVersion: v1
kind: Secret
metadata:
  name: modelforge-tls-cert
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  # In a production or staging cluster, these are issued by cert-manager / Let's Encrypt
  # or provisioned via your cloud provider (e.g. Google-managed SSL certificate).
  # NEVER COMMIT REAL PRIVATE KEYS TO GIT REPOSITORIES.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDazCCAlOgAwIBAgIUeExampleCertificatePlaceholder...
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDExampleKey...
    -----END PRIVATE KEY-----
