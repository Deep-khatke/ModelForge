apiVersion: v1
kind: Service
metadata:
  name: modelforge-frontend
  namespace: modelforge
  labels:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: frontend
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 5173
      targetPort: 80
      protocol: TCP
    - name: http-alt
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: modelforge
    app.kubernetes.io/component: frontend
