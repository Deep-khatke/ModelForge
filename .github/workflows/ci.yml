name: ModelForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  OPENTOFU_VERSION: "1.12.6"
  VERSION: "1.5.0"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validation & Security Checks
  # ---------------------------------------------------------------------------
  validation-and-security:
    name: Lint, Secrets & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}

      - name: Validate OpenTofu Infrastructure
        run: |
          cd infra/terraform
          tofu init -backend=false
          tofu validate

      - name: Validate Kubernetes Manifests (Dry-Run / Schema)
        run: |
          # Validate all Kubernetes manifest YAML syntax
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/**/*.yaml', recursive=True)]"

      - name: Secret Scanning Gate
        run: |
          echo "Scanning repository for accidentally committed secrets or tokens..."
          # Scan for private keys, AWS/GCP keys, service accounts, and sensitive tokens
          ! git grep -E -I -i "(BEGIN RSA PRIVATE KEY|AIzaSy|service_account_token|client_secret)" -- ':!*.example.*' ':!tests/*' ':!.github/*' ':!scripts/*'

  # ---------------------------------------------------------------------------
  # 2. Backend CI Stage
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          pytest -q tests/

  # ---------------------------------------------------------------------------
  # 3. Frontend CI Stage
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Production Bundle Build
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # 4. Container Build & Packaging Gate
  # ---------------------------------------------------------------------------
  docker-build-and-package:
    name: Container Build & Packaging Gate
    needs: [validation-and-security, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t modelforge/backend:${{ env.VERSION }} -t modelforge/backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t modelforge/frontend:${{ env.VERSION }} -t modelforge/frontend:latest ./frontend

      - name: Build Inference Service Image
        run: |
          docker build -t modelforge/inference:${{ env.VERSION }} -t modelforge/inference:latest ./inference_service
